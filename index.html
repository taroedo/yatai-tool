<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f58220">
  <title>篠四 イベント会計ポータル</title>
  <link rel="stylesheet" href="shared/portal.css?v=3">
</head>
<body>
<section id="loginView" class="login card hidden">
  <h2>イベント会計ポータル</h2>
  <p>関係者用のアクセスコードを入力してください。</p>
  <form id="loginForm">
    <label for="accessCode">アクセスコード</label>
    <input id="accessCode" type="password" inputmode="numeric" autocomplete="off" required>
    <button class="primary">ログイン</button>
  </form>
  <p id="loginError" class="error" aria-live="polite"></p>
</section>

<main id="portalView" class="shell hidden">
  <header class="brand">
    <div>
      <h1>篠四 イベント会計</h1>
      <p>使用するイベントと画面を選択してください</p>
    </div>
    <button id="logout" class="logout">ログアウト</button>
  </header>

  <section class="event-grid">
    <article class="event-card">
      <div class="event-head">
        <div><h3>盆踊り</h3><p>焼きそば・フランクの本番会計システム</p></div>
        <span class="status">使用可能</span>
      </div>
      <div class="event-actions">
        <a class="button register" href="bonodori/register.html?v=6">レジ画面</a>
        <a class="button admin" href="bonodori/admin.html?v=5">管理・監視</a>
      </div>
    </article>

    <article class="event-card autumn">
      <div class="event-head">
        <div><h3>オータムフェスティバル</h3><p>6商品の本番会計システム</p></div>
        <span class="status">使用可能</span>
      </div>
      <div class="event-actions">
        <a class="button register" href="autumn/register.html?v=2">レジ画面</a>
        <a class="button admin" href="autumn/admin.html?v=2">管理・監視</a>
      </div>
    </article>

    <article class="event-card test">
      <div class="event-head">
        <div><h3>UI検証ページ</h3><p>Firebaseへ送信せず、イベント別のレジ操作を安全に試せます</p></div>
        <span class="status">本番データ不使用</span>
      </div>
      <div class="event-actions">
        <a class="button preview" href="ui-test.html?v=5">盆踊りUI検証</a>
        <a class="button autumn-preview" href="ui-test-autumn.html?v=1">オータムUI検証</a>
      </div>
    </article>
  </section>
  <p class="note">入口のログイン状態はこの端末に12時間保存されます。管理・監視画面では、別途管理PINが必要です。</p>
</main>

<script src="shared/portal-config.js?v=1"></script>
<script src="shared/portal.js?v=1"></script>
</body>
</html>
