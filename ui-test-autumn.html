<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#b66a24">
  <title>オータムフェスレジ UI検証</title>
  <style>html{visibility:hidden}html.portal-authorized{visibility:visible}.form-note{color:#667085;font-size:12px;margin:7px 2px 0}.badge.test{background:#e8f1f9;color:#135988}.badge.local{background:#dff5e8;color:#086c36}.modal label{display:block;margin-top:10px}.modal input,.modal select{width:100%;min-height:46px;border:1px solid #d6dae0;border-radius:9px;padding:8px;margin-top:4px;background:#fff}</style>
  <script src="shared/portal-config.js?v=1"></script>
  <script src="shared/access-guard.js?v=1" data-portal="index.html"></script>
  <link rel="stylesheet" href="bonodori/styles.css?v=6">
  <link rel="stylesheet" href="bonodori/register-ui.css?v=1">
  <link rel="stylesheet" href="autumn/autumn.css?v=1">
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>オータムフェス UI検証</h1>
      <div class="badges">
        <span id="registerBadge" class="badge">レジ1</span>
        <span id="cashierBadge" class="badge">会計担当1</span>
        <span class="badge test">UI検証用</span>
        <span class="badge local">ローカル動作</span>
      </div>
    </div>
    <a class="top-link" href="index.html">トップ</a>
  </header>

  <section class="card form">
    <div class="two-col">
      <label>レジ<select id="registerId"><option value="R1">レジ1</option><option value="R2">レジ2</option></select></label>
      <label>担当者<select id="cashierId"><option value="C1">会計担当1</option><option value="C2">会計担当2</option></select></label>
    </div>
    <p class="form-note">このページの操作内容はFirebase、管理画面、他の端末へ送信されません。再読み込みすると初期化されます。</p>
  </section>

  <section class="card">
    <h2>商品数量</h2>
    <div class="product-grid">
      <article class="product"><h3>フランク</h3><div class="unit">1本 100円</div><div class="qty-row"><button class="minus" data-product="frankfurter" data-delta="-1" aria-label="フランクを1本減らす">−</button><output id="frankfurterQty" class="qty">0</output><button class="plus" data-product="frankfurter" data-delta="1" aria-label="フランクを1本増やす">＋</button></div></article>
      <article class="product"><h3>焼きそば</h3><div class="unit">1食 200円</div><div class="qty-row"><button class="minus" data-product="yakisoba" data-delta="-1" aria-label="焼きそばを1食減らす">−</button><output id="yakisobaQty" class="qty">0</output><button class="plus" data-product="yakisoba" data-delta="1" aria-label="焼きそばを1食増やす">＋</button></div></article>
      <article class="product"><h3>チョコバナナ</h3><div class="unit">1本 100円</div><div class="qty-row"><button class="minus" data-product="chocolateBanana" data-delta="-1" aria-label="チョコバナナを1本減らす">−</button><output id="chocolateBananaQty" class="qty">0</output><button class="plus" data-product="chocolateBanana" data-delta="1" aria-label="チョコバナナを1本増やす">＋</button></div></article>
      <article class="product"><h3>焼き菓子①</h3><div class="unit">1個 100円</div><div class="qty-row"><button class="minus" data-product="bakedSweet1" data-delta="-1" aria-label="焼き菓子1を1個減らす">−</button><output id="bakedSweet1Qty" class="qty">0</output><button class="plus" data-product="bakedSweet1" data-delta="1" aria-label="焼き菓子1を1個増やす">＋</button></div></article>
      <article class="product"><h3>焼き菓子②</h3><div class="unit">1個 150円</div><div class="qty-row"><button class="minus" data-product="bakedSweet2" data-delta="-1" aria-label="焼き菓子2を1個減らす">−</button><output id="bakedSweet2Qty" class="qty">0</output><button class="plus" data-product="bakedSweet2" data-delta="1" aria-label="焼き菓子2を1個増やす">＋</button></div></article>
      <article class="product"><h3>ドリンク</h3><div class="unit">1本 100円</div><div class="qty-row"><button class="minus" data-product="drink" data-delta="-1" aria-label="ドリンクを1本減らす">−</button><output id="drinkQty" class="qty">0</output><button class="plus" data-product="drink" data-delta="1" aria-label="ドリンクを1本増やす">＋</button></div></article>
    </div>
    <div class="sum-box" style="margin-top:7px;display:flex;align-items:center;justify-content:space-between;padding:5px 12px"><div class="sum-label">合計金額</div><div id="total" class="sum-value">0円</div></div>
  </section>

  <section class="card">
    <h2>預かり金額</h2>
    <div id="received" class="received">0円</div>
    <div class="money"><button data-money="10000">+10,000円</button><button data-money="5000">+5,000円</button><button data-money="1000">+1,000円</button><button data-money="500">+500円</button><button data-money="100">+100円</button><button data-money="50">+50円</button></div>
    <div class="actions"><button id="undoMoney" class="soft">1つ戻す</button><button id="clearMoney" class="clear" aria-label="預かり金額をクリア">クリア</button><button id="exactMoney" class="exact">ちょうど</button></div>
    <div class="sum-box" style="margin-top:7px;display:flex;align-items:center;justify-content:space-between;padding:5px 12px"><div class="sum-label">お釣り</div><div id="change" class="sum-value">0円</div></div>
    <button id="checkout" class="checkout" disabled>会計する</button><div id="notice" class="notice" aria-live="polite"></div>
  </section>

  <section class="card"><h2>このページでの累計</h2><div class="summary"><div class="sum-box"><div class="sum-label">販売数</div><div id="registerItems" class="sum-value">0点</div></div><div class="sum-box"><div class="sum-label">売上</div><div id="registerSales" class="sum-value">0円</div></div></div><button id="cancelLast" class="secondary" disabled>直前の会計を取り消す</button></section>
</main>

<dialog id="cancelDialog"><form method="dialog" class="modal"><h2>直前会計の取り消し</h2><p id="cancelTarget"></p><label>理由<select id="cancelReason"><option>数量入力ミス</option><option>預かり金額入力ミス</option><option>注文キャンセル</option><option>商品変更</option><option>その他</option></select></label><label>補足（任意）<input id="cancelNote" maxlength="100"></label><div class="modal-actions"><button value="cancel" class="cancel">戻る</button><button id="confirmCancel" value="default" class="close-session">取り消す</button></div></form></dialog>

<script>
  "use strict";
  const PRODUCTS=[
    {key:"frankfurter",field:"frankfurterQty",price:100},
    {key:"yakisoba",field:"yakisobaQty",price:200},
    {key:"chocolateBanana",field:"chocolateBananaQty",price:100},
    {key:"bakedSweet1",field:"bakedSweet1Qty",price:100},
    {key:"bakedSweet2",field:"bakedSweet2Qty",price:150},
    {key:"drink",field:"drinkQty",price:100}
  ];
  const $=id=>document.getElementById(id);
  const yen=value=>`${Number(value).toLocaleString("ja-JP")}円`;
  const emptyQuantities=()=>Object.fromEntries(PRODUCTS.map(product=>[product.key,0]));
  let current={quantities:emptyQuantities(),received:0,moneyStack:[]};
  let sales=[];
  let sequence=0;
  let cancelCandidate=null;

  function total(){return PRODUCTS.reduce((sum,product)=>sum+current.quantities[product.key]*product.price,0)}
  function validSales(){return sales.filter(sale=>!sale.cancelled)}
  function selectedText(id){return $(id).selectedOptions[0].textContent}
  function quantityFields(source){return Object.fromEntries(PRODUCTS.map(product=>[product.field,Number(source[product.field]??source.quantities?.[product.key]??0)]))}

  function render(){
    const amount=total();
    const shortage=Math.max(amount-current.received,0);
    const change=Math.max(current.received-amount,0);
    const active=validSales();
    const itemCount=active.reduce((sum,sale)=>sum+PRODUCTS.reduce((count,product)=>count+Number(sale[product.field]||0),0),0);
    const salesAmount=active.reduce((sum,sale)=>sum+sale.total,0);
    PRODUCTS.forEach(product=>{$(`${product.key}Qty`).textContent=current.quantities[product.key]});
    $("received").textContent=yen(current.received);
    $("total").textContent=yen(amount);
    $("change").textContent=shortage?`不足 ${yen(shortage)}`:yen(change);
    $("change").classList.toggle("short",shortage>0);
    $("checkout").disabled=!amount||shortage>0;
    $("undoMoney").disabled=!current.moneyStack.length;
    $("clearMoney").disabled=!current.received;
    $("exactMoney").disabled=!amount;
    $("registerItems").textContent=`${itemCount}点`;
    $("registerSales").textContent=yen(salesAmount);
    $("cancelLast").disabled=!active.length;
    $("registerBadge").textContent=selectedText("registerId");
    $("cashierBadge").textContent=selectedText("cashierId");
  }

  document.querySelectorAll("[data-product]").forEach(button=>button.addEventListener("click",()=>{const key=button.dataset.product;current.quantities[key]=Math.max(0,current.quantities[key]+Number(button.dataset.delta));render()}));
  document.querySelectorAll("[data-money]").forEach(button=>button.addEventListener("click",()=>{const value=Number(button.dataset.money);current.received+=value;current.moneyStack.push(value);render()}));
  [$("registerId"),$("cashierId")].forEach(select=>select.addEventListener("change",render));
  $("undoMoney").addEventListener("click",()=>{current.received=Math.max(0,current.received-(current.moneyStack.pop()||0));render()});
  $("clearMoney").addEventListener("click",()=>{current.received=0;current.moneyStack=[];render()});
  $("exactMoney").addEventListener("click",()=>{current.received=total();current.moneyStack=[];render()});
  $("checkout").addEventListener("click",()=>{
    const amount=total();
    if(!amount||current.received<amount)return;
    sequence+=1;
    const sale={receiptNo:`AUTUMN-TEST-${$("registerId").value}-${String(sequence).padStart(4,"0")}`,registerId:$("registerId").value,cashierId:$("cashierId").value,...quantityFields(current),total:amount,received:current.received,change:current.received-amount,cancelled:false};
    sales.push(sale);
    current={quantities:emptyQuantities(),received:0,moneyStack:[]};
    $("notice").textContent=`${sale.receiptNo} 会計完了`;
    window.setTimeout(()=>{$("notice").textContent=""},2500);
    render();
  });
  $("cancelLast").addEventListener("click",()=>{cancelCandidate=[...validSales()].reverse()[0];if(!cancelCandidate)return;$("cancelTarget").textContent=`${cancelCandidate.receiptNo}／${yen(cancelCandidate.total)}`;$("cancelReason").selectedIndex=0;$("cancelNote").value="";$("cancelDialog").showModal()});
  $("confirmCancel").addEventListener("click",event=>{event.preventDefault();if(!cancelCandidate)return;cancelCandidate.cancelled=true;cancelCandidate.cancelReason=$("cancelReason").value;cancelCandidate.cancelNote=$("cancelNote").value.trim();$("cancelDialog").close();$("notice").textContent=`${cancelCandidate.receiptNo} を取り消しました`;cancelCandidate=null;window.setTimeout(()=>{$("notice").textContent=""},2500);render()});
  render();
</script>
</body>
</html>
