<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f58220"><title>屋台レジ</title><link rel="stylesheet" href="styles.css"></head><body>
<main id="registerView" class="app"><header class="top"><div><h1>屋台売上計算</h1><div class="badges"><span id="registerBadge" class="badge">レジ未設定</span><span id="cashierBadge" class="badge">担当未設定</span><span id="sessionBadge" class="badge">営業前</span><span id="networkBadge" class="badge offline">確認中</span><span id="outboxBadge" class="badge">未送信 0件</span></div></div></header>
<section class="card form"><div class="two-col"><label>レジ<select id="registerId"><option value="R1">レジ1</option><option value="R2">レジ2</option></select></label><label>担当者<select id="cashierId"><option value="C1">会計担当1</option><option value="C2">会計担当2</option></select></label></div></section>
<section class="card"><h2>商品数量</h2><div class="product-grid"><article class="product"><h3>焼きそば</h3><div class="unit">1個 300円</div><div class="qty-row"><button class="minus" data-product="yakisoba" data-delta="-1">−</button><output id="yakisobaQty" class="qty">0</output><button class="plus" data-product="yakisoba" data-delta="1">＋</button></div></article><article class="product"><h3>フランク</h3><div class="unit">1本 200円</div><div class="qty-row"><button class="minus" data-product="frankfurter" data-delta="-1">−</button><output id="frankfurterQty" class="qty">0</output><button class="plus" data-product="frankfurter" data-delta="1">＋</button></div></article></div></section>
<section class="card"><h2>預かり金額</h2><div id="received" class="received">0円</div><div class="money"><button data-money="10000">+10,000円</button><button data-money="5000">+5,000円</button><button data-money="1000">+1,000円</button><button data-money="500">+500円</button><button data-money="100">+100円</button></div><div class="actions"><button id="undoMoney" class="soft">1つ戻す</button><button id="exactMoney" class="exact">ちょうど</button></div><div class="summary"><div class="sum-box"><div class="sum-label">合計金額</div><div id="total" class="sum-value">0円</div></div><div class="sum-box"><div class="sum-label">お釣り</div><div id="change" class="sum-value">0円</div></div></div><button id="checkout" class="checkout" disabled>会計する</button><div id="notice" class="notice"></div></section>
<section class="card"><h2>このレジの累計</h2><div class="summary"><div class="sum-box"><div class="sum-label">販売数</div><div id="registerItems" class="sum-value">0点</div></div><div class="sum-box"><div class="sum-label">売上</div><div id="registerSales" class="sum-value">0円</div></div></div><button id="cancelLast" class="secondary">直前の会計を取り消す</button></section></main>
<dialog id="cancelDialog"><form method="dialog" class="modal"><h2>直前会計の取り消し</h2><p id="cancelTarget"></p><label>理由<select id="cancelReason"><option>数量入力ミス</option><option>預かり金額入力ミス</option><option>注文キャンセル</option><option>商品変更</option><option>その他</option></select></label><input id="cancelNote" placeholder="補足（任意）"><div class="modal-actions"><button value="cancel" class="cancel">戻る</button><button id="confirmCancel" value="default" class="close-session">取り消す</button></div></form></dialog>
<script type="module" src="register.js?v=3"></script>
