<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>屋台売上計算</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 420px; margin: auto; }
  h2 { text-align: center; }
  .item { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
  .name { flex: 1; }
  .price { width: 80px; text-align: right; }
  .controls { display: flex; align-items: center; }
  button { font-size: 1.2em; padding: 5px; }
  input[type="number"], input[type="tel"] { width: 60px; text-align: center; font-size: 1.2em; margin: 0 5px; }
  .total, .change { font-size: 1.4em; font-weight: bold; text-align: right; margin-top: 15px; }
  .money-input { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
  .money-input input { width: 150px; font-size: 1.2em; text-align: right; }
  .money-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .money-buttons button { flex: 1 1 calc(33% - 10px); font-size: 1.1em; padding: 10px; }
</style>
</head>
<body>

<h2>屋台売上計算</h2>

<!-- 商品1 -->
<div class="item">
  <div class="name">焼きそば</div>
  <div class="price">300円</div>
  <div class="controls">
    <button data-btn="-1" data-target="yakisoba">−</button>
    <input type="number" id="yakisoba" value="0" min="0" readonly>
    <button data-btn="1" data-target="yakisoba">＋</button>
  </div>
</div>

<!-- 商品2 -->
<div class="item">
  <div class="name">フランクフルト</div>
  <div class="price">200円</div>
  <div class="controls">
    <button data-btn="-1" data-target="frank">−</button>
    <input type="number" id="frank" value="0" min="0" readonly>
    <button data-btn="1" data-target="frank">＋</button>
  </div>
</div>

<!-- 預かり金額 -->
<div class="money-input">
  <label for="received">預かり金額:</label>
  <input 
    type="tel" 
    inputmode="numeric" 
    pattern="[0-9]*" 
    id="received" 
    value="0" 
    min="0" 
    readonly>
</div>

<!-- 金額加算ボタン -->
<div class="money-buttons">
  <button data-add="1000">+1000円</button>
  <button data-add="500">+500円</button>
  <button data-add="100">+100円</button>
  <button data-add="50">+50円</button>
  <button data-add="10">+10円</button>
  <button id="resetMoney">リセット</button>
</div>

<!-- 合計とお釣り -->
<div class="total" id="total">合計: 0 円</div>
<div class="change" id="change">お釣り: 0 円</div>

<script>
const prices = { yakisoba: 300, frank: 200 };

document.addEventListener('DOMContentLoaded', () => {
    // 数量ボタン
    document.querySelectorAll('[data-btn]').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.target;
            const delta = parseInt(btn.dataset.btn, 10);
            changeQty(id, delta);
        });
    });

    // 金額加算ボタン
    document.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
            const addValue = parseInt(btn.dataset.add, 10);
            const input = document.getElementById('received');
            let current = parseInt(input.value) || 0;
            input.value = current + addValue;
            calculateTotal();
        });
    });

    // リセットボタン
    document.getElementById('resetMoney').addEventListener('click', () => {
        document.getElementById('received').value = 0;
        calculateTotal();
    });
});

function changeQty(id, delta) {
    const input = document.getElementById(id);
    let value = parseInt(input.value) || 0;
    value = Math.max(0, value + delta);
    input.value = value;
    calculateTotal();
}

function calculateTotal() {
    let total = 0;
    for (let key in prices) {
        const qty = parseInt(document.getElementById(key).value) || 0;
        total += prices[key] * qty;
    }
    document.getElementById('total').textContent = `合計: ${total.toLocaleString()} 円`;

    const received = parseInt(document.getElementById('received').value) || 0;
    const change = Math.max(0, received - total);
    document.getElementById('change').textContent = `お釣り: ${change.toLocaleString()} 円`;
}
</script>

</body>
</html>
