<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>屋台 管理・監視</title><link rel="stylesheet" href="styles.css"></head><body>
<section id="loginView" class="login card"><h1>管理・監視</h1><p class="muted">管理PINを入力してください。</p><form id="loginForm" class="form"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="管理PIN" required><button class="primary">管理画面を開く</button></form><p id="loginError" class="danger"></p></section>
<main id="adminView" class="app hidden"><header class="top"><div><h1>屋台 管理・監視</h1><div class="badges"><span id="sessionBadge" class="badge">営業前</span><span id="r1Status" class="badge">レジ1 未接続</span><span id="r2Status" class="badge">レジ2 未接続</span></div></div><button id="logout" class="logout">ログアウト</button></header>
<section class="card"><h2>営業管理</h2><div id="startControls" class="form two-col"><label>営業日<select id="businessDay"><option value="1">1日目</option><option value="2">2日目</option></select></label><label>営業日付<input id="businessDate" type="date"></label><button id="startSession" class="primary">営業を開始</button></div><div id="openControls" class="actions hidden"><button id="exportCsv" class="primary">全レジCSV出力</button><button id="openClose" class="close-session">営業を締める</button></div></section>
<section class="card"><h2>リアルタイム集計</h2><div class="metrics"><div class="metric"><span>総売上</span><strong id="totalSales">0円</strong></div><div class="metric"><span>有効会計</span><strong id="saleCount">0件</strong></div><div class="metric"><span>取消</span><strong id="cancelCount">0件</strong></div><div class="metric"><span>取消金額</span><strong id="cancelAmount">0円</strong></div><div class="metric"><span>焼きそば</span><strong id="yakisobaCount">0個</strong></div><div class="metric"><span>フランク</span><strong id="frankCount">0本</strong></div><div class="metric"><span>レジ1売上</span><strong id="r1Sales">0円</strong></div><div class="metric"><span>レジ2売上</span><strong id="r2Sales">0円</strong></div></div></section>
<section class="card"><h2>担当別会計件数</h2><div class="two-col"><div class="metric"><span>会計担当1</span><strong id="c1Count">0件</strong></div><div class="metric"><span>会計担当2</span><strong id="c2Count">0件</strong></div></div></section>
<section class="card"><h2>取引履歴</h2><div class="table-wrap"><table><thead><tr><th>時刻</th><th>番号</th><th>レジ</th><th>担当</th><th>種別</th><th>焼きそば</th><th>フランク</th><th>金額</th><th>理由</th></tr></thead><tbody id="transactionsBody"></tbody></table></div></section></main>
<dialog id="closeDialog"><div class="modal"><h2>営業締め</h2><div class="form two-col"><label>レジ1 開始釣り銭<input id="r1Float" type="number" min="0" value="0"></label><label>レジ1 実際の現金<input id="r1Actual" type="number" min="0" value="0"></label><label>レジ2 開始釣り銭<input id="r2Float" type="number" min="0" value="0"></label><label>レジ2 実際の現金<input id="r2Actual" type="number" min="0" value="0"></label><label>焼きそば準備数<input id="yPrepared" type="number" min="0" value="0"></label><label>焼きそば残数<input id="yRemain" type="number" min="0" value="0"></label><label>フランク準備数<input id="fPrepared" type="number" min="0" value="0"></label><label>フランク残数<input id="fRemain" type="number" min="0" value="0"></label></div><div class="modal-actions"><button id="cancelClose" class="cancel">戻る</button><button id="confirmClose" class="close-session">締めを確定</button></div></div></dialog>
<script type="module" src="admin.js?v=2"></script></body></html>
