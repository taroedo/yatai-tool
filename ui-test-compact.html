<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f58220"><title>盆踊りレジ UI検証②</title><style>html{visibility:hidden}html.portal-authorized{visibility:visible}</style><script src="shared/portal-config.js?v=1"></script><script src="shared/access-guard.js?v=1" data-portal="index.html"></script><link rel="stylesheet" href="shared/ui-test-compact.css?v=1"></head>
<body><main class="app">
<header class="top"><div><h1>盆踊り UI検証②</h1><div class="badges"><span class="badge">ファーストビュー重視</span><span class="badge local">ローカル動作</span></div></div><a class="top-link" href="index.html">トップ</a></header>
<section class="card"><h2>商品数量</h2><div class="product-grid">
<article class="product"><h3>焼きそば</h3><div class="unit">1個 300円</div><div class="qty-row"><button class="minus" data-product="yakisoba" data-delta="-1" aria-label="焼きそばを1個減らす">−</button><output id="yakisobaQty" class="qty">0</output><button class="plus" data-product="yakisoba" data-delta="1" aria-label="焼きそばを1個増やす">＋</button></div></article>
<article class="product"><h3>フランク</h3><div class="unit">1本 200円</div><div class="qty-row"><button class="minus" data-product="frankfurter" data-delta="-1" aria-label="フランクを1本減らす">−</button><output id="frankfurterQty" class="qty">0</output><button class="plus" data-product="frankfurter" data-delta="1" aria-label="フランクを1本増やす">＋</button></div></article>
</div><div class="sum-row"><span class="sum-label">合計金額</span><strong id="total">0円</strong></div></section>
<section class="card"><div class="money-title"><h2>預かり金額</h2><strong id="received">0円</strong></div><div class="money"><button data-money="10000">+10,000円</button><button data-money="5000">+5,000円</button><button data-money="1000">+1,000円</button><button data-money="500">+500円</button><button data-money="100">+100円</button></div><div class="actions"><button id="undoMoney" class="soft">1つ戻す</button><button id="clearMoney" class="clear">クリア</button><button id="exactMoney" class="exact">ちょうど</button></div><div class="sum-row"><span class="sum-label">お釣り</span><strong id="change">0円</strong></div><button id="checkout" class="checkout" disabled>会計する</button><div id="notice" class="notice" aria-live="polite"></div></section>
<section class="card"><h2>このページでの累計</h2><div class="summary"><div class="sum-row"><span class="sum-label">販売数</span><div id="registerItems" class="sum-value">0点</div></div><div class="sum-row"><span class="sum-label">売上</span><div id="registerSales" class="sum-value">0円</div></div></div><button id="cancelLast" class="secondary" disabled>直前の会計を取り消す</button></section>
<section class="card form"><h2>レジ・担当者</h2><div class="two-col"><label>レジ<select id="registerId"><option value="R1">レジ1</option><option value="R2">レジ2</option></select></label><label>担当者<select id="cashierId"><option value="C1">会計担当1</option><option value="C2">会計担当2</option></select></label></div><p class="form-note">Firebaseや管理画面には送信されません。再読み込みすると初期化されます。</p></section>
</main><dialog id="cancelDialog"><form method="dialog" class="modal"><h2>直前会計の取り消し</h2><p id="cancelTarget"></p><label>理由<select id="cancelReason"><option>数量入力ミス</option><option>預かり金額入力ミス</option><option>注文キャンセル</option><option>商品変更</option><option>その他</option></select></label><label>補足（任意）<input id="cancelNote" maxlength="100"></label><div class="modal-actions"><button value="cancel" class="cancel">戻る</button><button id="confirmCancel" value="default" class="danger">取り消す</button></div></form></dialog>
<script>window.UI_TEST_CONFIG={receiptPrefix:"BONODORI-TEST2",products:[{key:"yakisoba",field:"yakisobaQty",price:300},{key:"frankfurter",field:"frankfurterQty",price:200}]};</script><script src="shared/ui-test-compact.js?v=1"></script></body></html>
